[project]
name = "rayon-gemm-viz"
version = "0.1.0"
description = "Performance visualization subproject for rayon-gemm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
visualize = "visualize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viz"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
