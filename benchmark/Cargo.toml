[package]
name = "gemm-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
tabled = "0.22.0"
indicatif = "0.18.6"
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-metal-performance-shaders = "0.3.2"

# Host-gated like `build.rs`'s own cfg: only a macOS build compiles the Swift shim.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }
